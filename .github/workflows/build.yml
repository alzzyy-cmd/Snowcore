name: Build SnowNWCore

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'build/**'
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Paper API version
        id: paper
        run: |
          set -e
          META="https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml"
          curl -sfL "$META" -o meta.xml
          V=$(grep -oE '<version>26\.1\.[0-9]+-R0\.1-SNAPSHOT</version>' meta.xml | grep -oE '26\.1\.[0-9]+-R0\.1-SNAPSHOT' | sort -V | tail -n1)
          if [ -z "$V" ]; then
            V=$(grep -oE '<latest>[^<]+</latest>' meta.xml | sed -E 's/<\/?latest>//g')
          fi
          echo "Paper API resolved: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        id: build
        continue-on-error: true
        run: |
          mvn -B package -Dpaper.version=${{ steps.paper.outputs.version }} 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Save build log and jar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || git pull --rebase origin main
          mkdir -p build
          cp -f build-output.log build/build.log 2>/dev/null || true
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            rm -f build/*.jar
            cp target/*.jar build/ 2>/dev/null || true
          fi
          git add -f build/
          git commit -m "ci: build output [skip ci]" || echo "no changes"
          git push

      - name: Upload jar artifact
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SnowNWCore-jar
          path: target/*.jar
          retention-days: 30

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
